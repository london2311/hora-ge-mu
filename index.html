<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

const CH = 48, G = 1.5, GN = CH/G, VIEW = 1;
const RAD = 0.5, EYE = 1.66, CLIMB = 1.15, WATER = -1.6;

function hashInt(x, y, s){
  let h = 2166136261 >>> 0;
  const mix = v => { h = Math.imul(h ^ (v & 0xffff), 16777619);
                     h = Math.imul(h ^ ((v >>> 16) & 0xffff), 16777619); };
  mix(x|0); mix(y|0); mix(s|0);
  h ^= h >>> 13; h = Math.imul(h, 2654435761); h ^= h >>> 16;
  return h >>> 0;
}
function rng(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5)|0;
    let t = Math.imul(a ^ (a>>>15), 1|a);
    t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0)/4294967296;
  };
}
const fdiv = (a,b) => Math.floor(a/b);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);

/* ---- ノイズ ---- */
function vnoise(x, y, p, s){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const at = (i,j) => (hashInt(((i%p)+p)%p, ((j%p)+p)%p, s)%1000)/1000;
  const a = at(xi,yi), b = at(xi+1,yi), c = at(xi,yi+1), d = at(xi+1,yi+1);
  return (a*(1-u)+b*u)*(1-v) + (c*(1-u)+d*u)*v;
}
function fbm(x, y, p, s, oct){
  let n = 0, amp = 0.5, f = 1;
  for(let o=0;o<(oct||4);o++){ n += vnoise(x*f, y*f, p*f, s+o)*amp; amp *= 0.5; f *= 2; }
  return n;
}

/* ---- テクスチャ ---- */
const texCache = {};
function makeTex(name, opt){
  if(texCache[name]) return texCache[name];
  const S = 256;
  const cc = document.createElement("canvas"); cc.width = cc.height = S;
  const hc = document.createElement("canvas"); hc.width = hc.height = S;
  const cx = cc.getContext("2d"), hx = hc.getContext("2d");
  const ci = cx.createImageData(S,S), hi = hx.createImageData(S,S);
  const P = opt.period || 4;
  for(let j=0;j<S;j++) for(let i=0;i<S;i++){
    const n = fbm(i/S*P, j/S*P, P, opt.seed);
    const c = opt.shade(i/S, j/S, n);
    const k = (j*S+i)*4;
    ci.data[k]=c[0]; ci.data[k+1]=c[1]; ci.data[k+2]=c[2]; ci.data[k+3]=255;
    const h = clamp(c[3] !== undefined ? c[3] : n*255, 0, 255);
    hi.data[k]=hi.data[k+1]=hi.data[k+2]=h; hi.data[k+3]=255;
  }
  cx.putImageData(ci,0,0); hx.putImageData(hi,0,0);
  if(opt.over) opt.over(cx, hx, S);
  const map = new THREE.CanvasTexture(cc), bump = new THREE.CanvasTexture(hc);
  for(const t of [map,bump]){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; }
  map.encoding = THREE.sRGBEncoding;
  texCache[name] = { map:map, bump:bump };
  return texCache[name];
}
function lines(cx, hx, S, o){
  for(const ctx of [cx,hx]){
    ctx.strokeStyle = ctx === cx ? o.color : "rgba(0,0,0,1)";
    ctx.lineWidth = o.w || 2.5;
    for(let c=0;c<=o.n;c++){
      if(o.vert){ ctx.beginPath(); ctx.moveTo(c*S/o.n,0); ctx.lineTo(c*S/o.n,S); ctx.stroke(); }
      else { ctx.beginPath(); ctx.moveTo(0,c*S/o.n); ctx.lineTo(S,c*S/o.n); ctx.stroke(); }
    }
  }
}
const TEX = {};
function initTextures(){
  TEX.rock = makeTex("rock",{seed:23,period:5,
    shade:(u,v,n)=>{const b=48+n*70;return [b*0.98,b*0.97,b*0.95,30+n*210];}});
  TEX.dirt = makeTex("dirt",{seed:31,period:7,
    shade:(u,v,n)=>{const b=40+n*44;return [b*1.18,b*0.94,b*0.68,60+n*140];}});
  TEX.grass = makeTex("grass",{seed:41,period:9,
    shade:(u,v,n)=>{const g=32+n*50;return [g*0.5,g*0.92,g*0.4,50+n*150];}});
  TEX.bark = makeTex("bark",{seed:53,period:5,
    over:(c,h,S)=>lines(c,h,S,{n:9,vert:true,color:"rgba(16,10,7,.85)",w:2}),
    shade:(u,v,n)=>{const s=fbm(u*2,v*14,8,71);const b=34+s*50;return [b*1.22,b*0.9,b*0.68,40+s*195];}});
  TEX.leaf = makeTex("leaf",{seed:61,period:8,
    shade:(u,v,n)=>{const g=20+n*42;return [g*0.55,g*0.95,g*0.48,60+n*120];}});
  TEX.water = makeTex("water",{seed:67,period:6,
    shade:(u,v,n)=>{const b=30+n*30;return [b*0.6,b*0.95,b*1.25,80+n*90];}});
  TEX.wood = makeTex("wood",{seed:103,period:4,
    over:(c,h,S)=>lines(c,h,S,{n:5,vert:true,color:"rgba(16,10,6,.85)",w:3}),
    shade:(u,v,n)=>{const s=fbm(u*1.5,v*10,8,113);const b=32+s*40;return [b*1.35,b*0.9,b*0.6,50+s*150];}});
  TEX.plank = makeTex("plank",{seed:107,period:4,
    over:(c,h,S)=>lines(c,h,S,{n:6,vert:false,color:"rgba(14,9,5,.85)",w:3}),
    shade:(u,v,n)=>{const s=fbm(u*10,v*1.5,8,117);const b=38+s*42;return [b*1.3,b*0.92,b*0.62,50+s*150];}});
  TEX.tatami = makeTex("tatami",{seed:131,period:6,
    over:(c,h,S)=>{c.strokeStyle="rgba(28,32,18,.75)";c.lineWidth=6;c.strokeRect(2,2,S-4,S-4);
      h.strokeStyle="rgba(0,0,0,1)";h.lineWidth=6;h.strokeRect(2,2,S-4,S-4);},
    shade:(u,v,n)=>{const s=fbm(u*40,v*2,64,137);const b=92+s*44;return [b*0.86,b*0.9,b*0.55,90+s*120];}});
  TEX.paper = makeTex("paper",{seed:139,period:5,
    over:(c,h,S)=>{lines(c,h,S,{n:4,vert:true,color:"rgba(60,46,30,.55)",w:4});
      lines(c,h,S,{n:5,vert:false,color:"rgba(60,46,30,.55)",w:4});},
    shade:(u,v,n)=>{const b=170+n*46;return [b,b*0.97,b*0.86,120+n*60];}});
  TEX.tile = makeTex("tile",{seed:149,period:6,
    over:(c,h,S)=>lines(c,h,S,{n:10,vert:true,color:"rgba(8,10,14,.8)",w:4}),
    shade:(u,v,n)=>{const b=36+n*30;return [b*0.9,b*0.96,b*1.12,60+n*140];}});
  TEX.metal = makeTex("metal",{seed:97,period:4,
    shade:(u,v,n)=>{const b=54+n*44;return [b*1.05,b*0.92,b*0.84,40+n*120];}});
  TEX.stone = makeTex("stone",{seed:11,period:6,
    over:(c,h,S)=>lines(c,h,S,{n:8,vert:false,color:"rgba(24,20,17,.85)",w:3}),
    shade:(u,v,n)=>{const b=70+n*66;return [b*1.02,b*0.96,b*0.86,60+n*180];}});
  TEX.plaster = makeTex("plaster",{seed:83,period:6,
    shade:(u,v,n)=>{const b=88+n*56;return [b*1.02,b*0.98,b*0.88,60+n*100];}});
}

/* ---- three.js ---- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.05, 200);
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const isTouch = matchMedia("(pointer: coarse)").matches;
if(isTouch) document.body.classList.add("touch");
const HQ = !isTouch;
if(HQ){ renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }

const hemi = new THREE.HemisphereLight(0x5c6f96, 0x1a1712, 0.5); scene.add(hemi);
const moon = new THREE.DirectionalLight(0x8fa6d8, 0.35);
moon.position.set(20, 42, -14); scene.add(moon);
const lamp = new THREE.SpotLight(0xffe3b0, 0, 36, 0.5, 0.45, 1.3);
lamp.position.set(0,0,0.1);
const lampTarget = new THREE.Object3D(); lampTarget.position.set(0,0,-1);
camera.add(lamp, lampTarget); lamp.target = lampTarget;
if(HQ){ lamp.castShadow = true; lamp.shadow.mapSize.set(1024,1024);
  lamp.shadow.camera.near = 0.3; lamp.shadow.camera.far = 36; lamp.shadow.bias = -0.0016; }
const glow = new THREE.PointLight(0xffd9a8, 0.16, 7, 2);
camera.add(glow); scene.add(camera);

const GEOM = {
  box: new THREE.BoxGeometry(1,1,1),
  cyl: new THREE.CylinderGeometry(0.5,0.5,1,10),
  cone: new THREE.ConeGeometry(0.5,1,8),
  roof: new THREE.ConeGeometry(0.75,1,4),
  rock: new THREE.DodecahedronGeometry(0.5, 0)
};
const MATS = {};
function mat(key, o){
  if(MATS[key]) return MATS[key];
  const t = TEX[o.tex];
  const m = new THREE.MeshStandardMaterial({
    color: o.color === undefined ? 0xffffff : o.color,
    roughness: o.rough === undefined ? 0.92 : o.rough,
    metalness: o.metal === undefined ? 0.02 : o.metal });
  m.map = t.map.clone(); m.bumpMap = t.bump.clone();
  m.map.needsUpdate = m.bumpMap.needsUpdate = true;
  m.map.wrapS = m.map.wrapT = m.bumpMap.wrapS = m.bumpMap.wrapT = THREE.RepeatWrapping;
  m.map.encoding = THREE.sRGBEncoding;
  m.map.repeat.set(o.rep||1, o.rep||1); m.bumpMap.repeat.copy(m.map.repeat);
  m.bumpScale = o.bump === undefined ? 0.35 : o.bump;
  MATS[key] = m; return m;
}
const MDEF = {
  bark:{tex:"bark",rep:1.4,bump:0.55}, leaf:{tex:"leaf",rep:2,rough:1},
  wood:{tex:"wood",rep:1.2}, wood_d:{tex:"wood",rep:1.2,color:0x6b5238},
  plank:{tex:"plank",rep:1.6}, plank_f:{tex:"plank",rep:10},
  tatami:{tex:"tatami",rep:1}, paper:{tex:"paper",rep:1,rough:0.98},
  tile:{tex:"tile",rep:2}, plaster:{tex:"plaster",rep:1.6},
  metal:{tex:"metal",rep:1,rough:0.55,metal:0.55},
  red:{tex:"plaster",rep:1.5,color:0x9c3a2c},
  stone:{tex:"stone",rep:1.2}, rock:{tex:"rock",rep:1.6,bump:0.6},
  dirt_f:{tex:"dirt",rep:14}, grass_f:{tex:"grass",rep:16},
  asphalt_f:{tex:"metal",rep:6,color:0x3a3a3e,rough:0.9},
  paddy:{tex:"grass",rep:4,color:0x4a5a3a}
};
function matFor(k){ return mat(k, MDEF[k] || MDEF.wood); }

/* ============ 地形 ============ */
const BOUND = 152;                 // 逃げられる範囲の半径（m）
let BRIDGES = [];
function riverZ(x){ return Math.sin(x*0.021)*22 + Math.sin(x*0.0065)*30 + 46; }
function hForest(x, z){
  let h = (fbm(x*0.0075+40, z*0.0075+40, 4096, 5, 5)-0.5)*36;
  h += (fbm(x*0.031+9, z*0.031+9, 4096, 17, 3)-0.5)*7.5;
  const st = 3.6;
  h = h*0.45 + Math.round(h/st)*st*0.55;          // 段丘＝崖
  h += 3.2;
  const rd = Math.abs(z - riverZ(x)), bank = 21, core = 6.5;
  if(rd < bank){
    const k = clamp((bank-rd)/(bank-core), 0, 1);   // 川心で1
    h = h*(1-k*k) + (WATER-2.6)*(k*k);             // 川床まで削る
  }
  const d = Math.hypot(x,z);
  if(d > BOUND-22){ const e = (d-(BOUND-22))/16; h += Math.min(e*e*26, 42); }
  const ds = Math.hypot(x,z);
  if(ds < 18){ const k = (18-ds)/18; h = h*(1-k) + 2.6*k; }   // 出発点は平らな空き地
  return h;
}
function hFlat(){ return 0; }
function groundAt(x, z){
  for(const b of BRIDGES){
    if(Math.abs(x-b.x) < b.hx && Math.abs(z-b.z) < b.hz) return b.y;
  }
  return stage.H(x, z);
}
function slopeAt(x, z){
  const h0 = stage.H(x,z);
  return Math.max(Math.abs(stage.H(x+1.5,z)-h0), Math.abs(stage.H(x,z+1.5)-h0));
}

/* ============ 生成ヘルパ ============ */
function Builder(cx, cz){ this.cx = cx; this.cz = cz; this.items = []; this.cols = []; this.fusuma = []; }
Builder.prototype.add = function(k,m,x,y,z,sx,sy,sz,ry,solid){
  this.items.push({k:k,m:m,x:x,y:y,z:z,sx:sx,sy:sy,sz:sz,ry:ry||0});
  if(solid){
    if(ry && k === "box") this.cols.push({t:"c",x:x,z:z,a:Math.max(sx,sz)*0.45});
    else if(k === "box") this.cols.push({t:"r",x:x,z:z,a:sx/2,b:sz/2});
    else this.cols.push({t:"c",x:x,z:z,a:sx*0.47});
  }
};
Builder.prototype.box  = function(m,x,y,z,w,h,d,ry,solid){ this.add("box",m,x,y,z,w,h,d,ry,solid !== false); };
Builder.prototype.deco = function(m,x,y,z,w,h,d,ry){ this.add("box",m,x,y,z,w,h,d,ry,false); };
Builder.prototype.cyl  = function(m,x,y,z,r,h,solid){ this.add("cyl",m,x,y,z,r*2,h,r*2,0,solid !== false); };
Builder.prototype.cone = function(m,x,y,z,r,h,solid){ this.add("cone",m,x,y,z,r*2,h,r*2,0,!!solid); };
Builder.prototype.rock = function(m,x,y,z,r,ry,solid){ this.add("rock",m,x,y,z,r*2,r*2*0.8,r*2,ry,solid !== false); };
Builder.prototype.roof = function(m,x,y,z,r,h,ry){ this.add("roof",m,x,y,z,r*2,h,r*2,ry,false); };
Builder.prototype.fus  = function(x,y,z,w,ry){ this.fusuma.push({x:x,y:y,z:z,w:w,ry:ry}); };
function nearSpawn(x,z,d){ return Math.abs(x) < d && Math.abs(z) < d; }

/* ---- 1. 夜の森（起伏・崖・川） ---- */
function genForest(b, r){
  const ox = b.cx*CH, oz = b.cz*CH;
  for(let i=0;i<74;i++){
    const x = ox + r()*CH, z = oz + r()*CH;
    if(nearSpawn(x,z,5)) continue;
    const gy = stage.H(x,z);
    if(gy < WATER + 0.4) continue;               // 水中には生えない
    const sl = slopeAt(x,z);
    if(sl > 2.6) continue;                        // 崖には生えない
    const rad = 0.18+r()*0.4, hh = 8+r()*10;
    b.cyl("bark", x, gy+hh/2, z, rad, hh);
    b.cone("leaf", x, gy+hh*0.66+r()*1.5, z, 2.1+r()*1.9, 6+r()*4.5, false);
    b.cone("leaf", x, gy+hh*0.92, z, 1.3+r()*1.1, 4+r()*2.5, false);
    if(r()<0.25) b.cone("leaf", x+(r()-0.5)*2, gy+0.7, z+(r()-0.5)*2, 0.8+r()*0.7, 1.5, false); // 下草
  }
  for(let i=0;i<26;i++){
    const x = ox + r()*CH, z = oz + r()*CH;
    if(nearSpawn(x,z,4)) continue;
    const gy = stage.H(x,z);
    const t = r();
    if(t < 0.34) b.rock("rock", x, gy+0.4+r()*0.8, z, 0.7+r()*2.2, r()*3.1);          // 露岩
    else if(t < 0.6) b.box("bark", x, gy+0.4, z, 3+r()*5, 0.8, 0.8, r()*3.14, true);   // 倒木
    else if(t < 0.8) b.cone("leaf", x, gy+0.5, z, 0.9+r()*0.8, 1.4, false);            // 藪
    else { b.cyl("bark", x, gy+1.2, z, 0.28, 2.4, true);                                // 立ち枯れ
           b.deco("bark", x, gy+2.2, z, 1.6, 0.2, 0.2, r()*3); }
  }
  // 崖下の岩塊
  for(let i=0;i<10;i++){
    const x = ox + r()*CH, z = oz + r()*CH;
    if(slopeAt(x,z) < 2.0) continue;
    b.rock("rock", x, stage.H(x,z)+0.6, z, 1.0+r()*2.4, r()*3.1);
  }
}

/* ---- 2. 古い回廊 ---- */
const RC = 6.0;
function genCorridor(b, r){
  const n = Math.round(CH/RC);
  const v = new Uint8Array(n*n).fill(1), h = new Uint8Array(n*n).fill(1);
  const seen = new Uint8Array(n*n), st = [0]; seen[0] = 1;
  while(st.length){
    const cur = st[st.length-1], x = (cur/n)|0, z = cur%n, cand = [];
    if(x>0 && !seen[(x-1)*n+z]) cand.push(0);
    if(x<n-1 && !seen[(x+1)*n+z]) cand.push(1);
    if(z>0 && !seen[x*n+z-1]) cand.push(2);
    if(z<n-1 && !seen[x*n+z+1]) cand.push(3);
    if(!cand.length){ st.pop(); continue; }
    const d = cand[(r()*cand.length)|0];
    if(d===0){ v[x*n+z]=0; seen[(x-1)*n+z]=1; st.push((x-1)*n+z); }
    if(d===1){ v[(x+1)*n+z]=0; seen[(x+1)*n+z]=1; st.push((x+1)*n+z); }
    if(d===2){ h[x*n+z]=0; seen[x*n+z-1]=1; st.push(x*n+z-1); }
    if(d===3){ h[x*n+z+1]=0; seen[x*n+z+1]=1; st.push(x*n+z+1); }
  }
  for(let x=1;x<n;x++) for(let z=0;z<n;z++) if(r()<0.12) v[x*n+z]=0;
  for(let x=0;x<n;x++) for(let z=1;z<n;z++) if(r()<0.12) h[x*n+z]=0;
  for(let i=0;i<2;i++){ v[0*n+((r()*n)|0)]=0; h[(((r()*n)|0))*n]=0; }
  const ox = b.cx*CH, oz = b.cz*CH, WH = 3.0;
  const wall = (x,z,horiz) => {
    if(nearSpawn(x,z,3.6)) return;
    const gap = r() < 0.45, len = RC;
    if(gap){
      const seg = (len-2.2)/2, off = (seg+2.2)/2;
      for(const s of [-off,off]){
        if(horiz) b.box("wood_d", x+s, WH/2, z, seg, WH, 0.28, 0, true);
        else b.box("wood_d", x, WH/2, z+s, 0.28, WH, seg, 0, true);
      }
      if(horiz){ b.deco("wood", x, WH-0.14, z, len, 0.28, 0.34, 0); b.deco("wood", x, 0.06, z, len, 0.12, 0.34, 0); }
      else { b.deco("wood", x, WH-0.14, z, 0.34, 0.28, len, 0); b.deco("wood", x, 0.06, z, 0.34, 0.12, len, 0); }
      b.fus(x, 1.35, z, 2.2, horiz ? 0 : Math.PI/2);
    } else {
      if(horiz){ b.box("wood_d", x, WH/2, z, len, WH, 0.26, 0, true);
        b.deco("paper", x, 1.85, z, len-0.5, 1.7, 0.06, 0);
        b.deco("wood", x, WH-0.12, z, len, 0.24, 0.34, 0); }
      else { b.box("wood_d", x, WH/2, z, 0.26, WH, len, 0, true);
        b.deco("paper", x, 1.85, z, 0.06, 1.7, len-0.5, 0);
        b.deco("wood", x, WH-0.12, z, 0.34, 0.24, len, 0); }
    }
  };
  for(let x=0;x<n;x++) for(let z=0;z<n;z++){
    const i = x*n+z;
    if(v[i]) wall(ox+x*RC, oz+z*RC+RC/2, false);
    if(h[i]) wall(ox+x*RC+RC/2, oz+z*RC, true);
    const rx = ox+x*RC+RC/2, rz = oz+z*RC+RC/2;
    if(nearSpawn(rx,rz,4)) continue;
    b.deco("tatami", rx, 0.03, rz, RC-0.6, 0.06, RC-0.6, 0);
    const t = r();
    if(t<0.22){ b.box("wood", rx+(r()-0.5)*2, 0.85, rz+(r()-0.5)*2, 1.1, 1.7, 0.55, (r()*4|0)*1.57, true);
                b.deco("metal", rx, 1.0, rz, 0.12, 0.12, 0.6, 0); }
    else if(t<0.36) b.box("wood_d", rx, 0.28, rz, 1.5, 0.56, 0.9, r()*3, true);
    else if(t<0.46) b.deco("paper", rx+(r()-0.5)*3, 0.9, rz+(r()-0.5)*3, 1.8, 1.7, 0.1, r()*3);
    else if(t<0.54){ b.cyl("wood", rx, 0.5, rz, 0.13, 1.0, true); b.deco("paper", rx, 1.15, rz, 0.42, 0.42, 0.42, 0); }
    else if(t<0.6) b.cyl("wood", rx+(r()-0.5)*3, 1.5, rz+(r()-0.5)*3, 0.16, 3.0, true);
  }
}

/* ---- 3. サイレンの集落 ---- */
function genVillage(b, r){
  const ox = b.cx*CH, oz = b.cz*CH;
  const road = ((b.cz%2)+2)%2 === 0, czw = oz+CH/2, cxw = ox+CH/2;
  if(road){
    b.deco("asphalt_f", cxw, 0.02, czw, CH, 0.04, 7, 0);
    for(let i=2;i<CH;i+=6){
      if(r()<0.4) continue;
      b.cyl("wood", ox+i, 3.2, czw-4.6, 0.16, 6.4, true);
      b.deco("wood", ox+i, 5.9, czw-4.6, 1.6, 0.14, 0.14, 0);
    }
    if(r()<0.4){ const x = ox+r()*CH;
      b.box("metal", x, 0.9, czw+4.4, 1.0, 1.8, 0.7, 0, true);
      b.deco("paper", x, 1.1, czw+4.05, 0.8, 1.1, 0.06, 0); }
    if(r()<0.35){ const x = ox+r()*CH, a = (r()-0.5)*0.8;
      b.box("metal", x, 0.8, czw+(r()-0.5)*3, 3.4, 1.0, 1.6, a, true);
      b.deco("metal", x-0.6, 1.6, czw, 1.4, 0.9, 1.5, a); }
  }
  for(let a2=0;a2<2;a2++) for(let c=0;c<2;c++){
    if(r()<0.22) continue;
    const hx = ox+12+a2*24+(r()-0.5)*5, hz = oz+12+c*24+(r()-0.5)*5;
    if(nearSpawn(hx,hz,11)) continue;
    if(road && Math.abs(hz-czw)<8) continue;
    const w = 7+r()*4, d = 6+r()*4, HH = 3.0, door = (r()*4)|0;
    for(let s=0;s<4;s++){
      const horiz = s%2===0;
      const sx = horiz ? hx : hx+(s===1?w/2:-w/2);
      const sz = horiz ? hz+(s===0?-d/2:d/2) : hz;
      const len = horiz ? w : d;
      if(s === door){
        const seg = (len-2.0)/2, off = (seg+2.0)/2;
        for(const o2 of [-off,off]){
          if(horiz) b.box("wood_d", sx+o2, HH/2, sz, seg, HH, 0.3, 0, true);
          else b.box("wood_d", sx, HH/2, sz+o2, 0.3, HH, seg, 0, true);
        }
        b.fus(sx, 1.35, sz, 2.0, horiz ? 0 : Math.PI/2);
      } else {
        if(horiz){ b.box("wood_d", sx, HH/2, sz, len, HH, 0.3, 0, true);
          b.deco("paper", sx, 1.7, sz+(s===0?-0.16:0.16), len-1.4, 1.4, 0.05, 0); }
        else { b.box("wood_d", sx, HH/2, sz, 0.3, HH, len, 0, true);
          b.deco("paper", sx+(s===1?0.16:-0.16), 1.7, sz, 0.05, 1.4, len-1.4, 0); }
      }
    }
    b.roof("tile", hx, HH+0.9, hz, (w+d)/4*0.95, 2.0, Math.PI/4);
    if(r()<0.5) b.box("wood", hx+w/2+2.4, 0.8, hz, 0.18, 1.6, d, 0, true);
  }
  if(r()<0.22){ const x = ox+r()*CH, z = oz+r()*CH;
    if(!nearSpawn(x,z,8)){
      b.cyl("red", x-1.6, 1.8, z, 0.2, 3.6, true); b.cyl("red", x+1.6, 1.8, z, 0.2, 3.6, true);
      b.deco("red", x, 3.7, z, 4.4, 0.24, 0.34, 0); b.deco("red", x, 3.2, z, 3.4, 0.2, 0.26, 0); } }
  if(r()<0.5){ const x = ox+8+r()*30, z = oz+8+r()*30;
    if(!nearSpawn(x,z,10) && !(road && Math.abs(z-czw)<8)) b.deco("paddy", x, 0.015, z, 14, 0.03, 12, 0); }
  for(let i=0;i<9;i++){
    const x = ox+r()*CH, z = oz+r()*CH;
    if(nearSpawn(x,z,6)) continue;
    if(road && Math.abs(z-czw)<6) continue;
    const hh = 5+r()*5;
    b.cyl("bark", x, hh/2, z, 0.2+r()*0.22, hh);
    b.cone("leaf", x, hh*0.78, z, 1.5+r()*1.2, 4+r()*2.5, false);
  }
  if(((b.cx*7+b.cz*13)%5) === 0){
    const x = ox+CH/2, z = oz+8;
    b.cyl("metal", x, 4.5, z, 0.2, 9, true);
    b.deco("metal", x, 8.8, z, 0.8, 0.8, 0.8, 0.6);
  }
}
function genBoundaryRocks(b, r){
  const ox = b.cx*CH, oz = b.cz*CH;
  for(let i=0;i<70;i++){
    const x = ox + r()*CH, z = oz + r()*CH;
    const d = Math.hypot(x,z);
    if(d < BOUND-6 || d > BOUND+16) continue;
    b.rock("rock", x, 1.4+r()*2.4, z, 2.0+r()*3.0, r()*3.1);
  }
}

const ORDER = ["forest","corridor","village"];
let stageKey = "forest", stage = STAGES.forest;

/* ============ チャンク ============ */
let levelSeed = 7;
const chunks = new Map(), dataCache = new Map();
const dummy = new THREE.Object3D();
const fusGeo = new THREE.BoxGeometry(1,1,0.08);
const fusFrameGeo = new THREE.BoxGeometry(1,1,0.14);
const TSEG = 24;
const terrGeoProto = new THREE.PlaneGeometry(CH, CH, TSEG, TSEG);
let terrainMat = null, waterMesh = null;

function makeTerrainMat(){
  const t = TEX[stage.ground === "grass_f" ? "grass" : (stage.ground === "dirt_f" ? "dirt" : "plank")];
  const m = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.97 });
  m.map = t.map.clone(); m.map.needsUpdate = true;
  m.map.wrapS = m.map.wrapT = THREE.RepeatWrapping;
  m.map.encoding = THREE.sRGBEncoding;
  m.map.repeat.set(CH/3, CH/3);
  m.bumpMap = t.bump.clone(); m.bumpMap.needsUpdate = true;
  m.bumpMap.wrapS = m.bumpMap.wrapT = THREE.RepeatWrapping;
  m.bumpMap.repeat.copy(m.map.repeat); m.bumpScale = 0.5;
  return m;
}
function makeTerrain(cx, cz){
  const geo = terrGeoProto.clone();
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count*3);
  const ox = cx*CH + CH/2, oz = cz*CH + CH/2;
  const c1 = new THREE.Color(0x4d5a3a), c2 = new THREE.Color(0x6d6355), c3 = new THREE.Color(0x8c8272);
  for(let i=0;i<pos.count;i++){
    const lx = pos.getX(i), lz = -pos.getY(i);
    const wx = ox + lx, wz = oz + lz;
    const y = stage.H(wx, wz);
    pos.setZ(i, y);
    const sl = slopeAt(wx, wz);
    const c = new THREE.Color();
    if(sl > 2.2) c.copy(c3);
    else if(sl > 1.0) c.copy(c2);
    else c.copy(c1);
    if(y < WATER + 1.2) c.lerp(new THREE.Color(0x6b6450), 0.6);
    const n = 0.82 + fbm(wx*0.08, wz*0.08, 4096, 3)*0.36;
    col[i*3] = c.r*n; col[i*3+1] = c.g*n; col[i*3+2] = c.b*n;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, terrainMat);
  m.rotation.x = -Math.PI/2;
  m.position.set(ox, 0, oz);
  if(HQ) m.receiveShadow = true;
  return m;
}
function buildData(cx, cz){
  const b = new Builder(cx, cz);
  const r = rng(hashInt(cx+levelSeed, cz-levelSeed, 91));
  const cd = Math.hypot(cx*CH+CH/2, cz*CH+CH/2);
  if(cd < BOUND + 24) stage.gen(b, r);
  if(!stage.water && cd > BOUND-40 && cd < BOUND+50) genBoundaryRocks(b, r);
  const blocked = new Uint8Array(GN*GN);
  const ox = cx*CH, oz = cz*CH;
  for(const c of b.cols){
    const pad = 0.42;
    const ax = c.a, az = c.t === "r" ? c.b : c.a;
    const i0 = Math.max(0, Math.floor((c.x-ax-pad-ox)/G)), i1 = Math.min(GN-1, Math.floor((c.x+ax+pad-ox)/G));
    const j0 = Math.max(0, Math.floor((c.z-az-pad-oz)/G)), j1 = Math.min(GN-1, Math.floor((c.z+az+pad-oz)/G));
    for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++) blocked[i*GN+j] = 1;
  }
  for(let i=0;i<GN;i++) for(let j=0;j<GN;j++){
    const wx = ox+i*G+G/2, wz = oz+j*G+G/2;
    if(Math.hypot(wx,wz) > BOUND){ blocked[i*GN+j] = 1; continue; }
    if(stage.H === hFlat) continue;
    const y = stage.H(wx,wz);
    if(y < WATER-0.9){ blocked[i*GN+j] = 1; continue; }
    if(slopeAt(wx,wz) > CLIMB*1.35) blocked[i*GN+j] = 1;
  }
  for(const br of BRIDGES){
    const i0 = Math.max(0, Math.floor((br.x-br.hx-ox)/G)), i1 = Math.min(GN-1, Math.floor((br.x+br.hx-ox)/G));
    const j0 = Math.max(0, Math.floor((br.z-br.hz-oz)/G)), j1 = Math.min(GN-1, Math.floor((br.z+br.hz-oz)/G));
    for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++) blocked[i*GN+j] = 0;
  }
  return { cols:b.cols, items:b.items, fusuma:b.fusuma, blocked:blocked };
}
function getData(cx, cz){
  const k = cx+","+cz;
  let d = dataCache.get(k);
  if(!d){ d = buildData(cx,cz); dataCache.set(k,d);
    if(dataCache.size > 200) dataCache.delete(dataCache.keys().next().value); }
  return d;
}
function isBlocked(gi, gj){
  const cx = fdiv(gi,GN), cz = fdiv(gj,GN);
  return getData(cx,cz).blocked[(gi-cx*GN)*GN + (gj-cz*GN)];
}
const gw = i => i*G + G/2;

function loadChunk(cx, cz){
  const k = cx+","+cz;
  if(chunks.has(k)) return;
  const d = getData(cx,cz);
  const g = new THREE.Group();
  const groups = new Map();
  for(const it of d.items){
    const key = it.k+"|"+it.m;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  for(const entry of groups){
    const parts = entry[0].split("|"), list = entry[1];
    const im = new THREE.InstancedMesh(GEOM[parts[0]], matFor(parts[1]), list.length);
    for(let i=0;i<list.length;i++){
      const it = list[i];
      dummy.position.set(it.x, it.y, it.z);
      dummy.rotation.set(0, it.ry, 0);
      dummy.scale.set(it.sx, it.sy, it.sz);
      dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
    if(HQ){ im.castShadow = true; im.receiveShadow = true; }
    g.add(im);
  }
  g.add(makeTerrain(cx, cz));
  if(stage.ceil){
    const ce = new THREE.Mesh(new THREE.PlaneGeometry(CH,CH), matFor(stage.ceil.mat));
    ce.rotation.x = Math.PI/2; ce.position.set(cx*CH+CH/2, stage.ceil.y, cz*CH+CH/2);
    g.add(ce);
  }
  const fus = [];
  for(const f of d.fusuma){
    const grp = new THREE.Group();
    const panel = new THREE.Mesh(fusGeo, matFor("paper")); panel.scale.set(f.w, 2.5, 1);
    const frame = new THREE.Mesh(fusFrameGeo, matFor("wood")); frame.scale.set(f.w, 0.12, 1); frame.position.y = 1.25;
    grp.add(panel, frame);
    grp.position.set(f.x, f.y, f.z); grp.rotation.y = f.ry;
    grp.userData = { open:0, w:f.w, opened:false };
    g.add(grp); fus.push(grp);
  }
  scene.add(g);
  chunks.set(k, { group:g, cols:d.cols, fusuma:fus });
}
function unloadChunk(k){
  const c = chunks.get(k);
  c.group.traverse(o => { if(o.isInstancedMesh) o.dispose();
    if(o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.color) o.geometry.dispose(); });
  scene.remove(c.group); chunks.delete(k);
}
function syncChunks(px, pz){
  const cx = fdiv(px,CH), cz = fdiv(pz,CH);
  for(let x=cx-VIEW;x<=cx+VIEW;x++) for(let z=cz-VIEW;z<=cz+VIEW;z++) loadChunk(x,z);
  for(const k of Array.from(chunks.keys())){
    const p = k.split(",");
    if(Math.abs(p[0]-cx) > VIEW || Math.abs(p[1]-cz) > VIEW) unloadChunk(k);
  }
}

/* ============ 当たり判定・経路 ============ */
function pushOut(px, pz, rad){
  const cx = fdiv(px,CH), cz = fdiv(pz,CH);
  for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){
    const c = chunks.get((cx+a)+","+(cz+b));
    if(!c) continue;
    for(const col of c.cols){
      if(Math.abs(col.x-px) > 6 || Math.abs(col.z-pz) > 6) continue;
      if(col.t === "c"){
        const dx = px-col.x, dz = pz-col.z, need = col.a+rad, d = Math.hypot(dx,dz);
        if(d < need && d > 1e-5){ px = col.x+dx/d*need; pz = col.z+dz/d*need; }
      } else {
        const nx = clamp(px, col.x-col.a, col.x+col.a), nz = clamp(pz, col.z-col.b, col.z+col.b);
        const dx = px-nx, dz = pz-nz, d = Math.hypot(dx,dz);
        if(d < rad){
          if(d < 1e-5){
            const o1 = px-col.x, o2 = pz-col.z;
            if(Math.abs(o1)/col.a > Math.abs(o2)/col.b) px = col.x + Math.sign(o1||1)*(col.a+rad);
            else pz = col.z + Math.sign(o2||1)*(col.b+rad);
          } else { px = nx+dx/d*rad; pz = nz+dz/d*rad; }
        }
      }
    }
  }
  return [px, pz];
}
function findPath(si, sj, ti, tj, limit){
  if(si === ti && sj === tj) return [[si,sj]];
  const prev = new Map(), q = [[si,sj]];
  prev.set(si+","+sj, null);
  let head = 0, hit = false;
  while(head < q.length && head < limit){
    const cur = q[head++], x = cur[0], z = cur[1];
    const nb = [[x-1,z],[x+1,z],[x,z-1],[x,z+1]];
    for(const n of nb){
      const k = n[0]+","+n[1];
      if(prev.has(k)) continue;
      if(isBlocked(n[0],n[1])) continue;
      prev.set(k, cur); q.push(n);
      if(n[0] === ti && n[1] === tj){ hit = true; break; }
    }
    if(hit) break;
  }
  if(!hit) return null;
  const path = []; let node = [ti,tj], k = ti+","+tj;
  while(node){ path.push(node); node = prev.get(k); if(node) k = node[0]+","+node[1]; }
  return path.reverse();
}
function freeCellNear(wx, wz){
  const gi = Math.floor(wx/G), gj = Math.floor(wz/G);
  if(!isBlocked(gi,gj)) return [gi,gj];
  for(let r=1;r<20;r++) for(let a=-r;a<=r;a++) for(let b=-r;b<=r;b++){
    if(Math.max(Math.abs(a),Math.abs(b)) !== r) continue;
    if(!isBlocked(gi+a,gj+b)) return [gi+a,gj+b];
  }
  return [gi,gj];
}

function stepFoePath(f, dt, tx, tz, spd){
  f.timer -= dt;

    const s = freeCellNear(f.x, f.z), t = freeCellNear(tx, tz);
    f.path = findPath(s[0], s[1], t[0], t[1], 5000);
    f.idx = 1; f.timer = 0.55;
  }
  if(f.path && f.path.length > 1){
    const st = f.path[Math.min(f.idx, f.path.length-1)];
    const wx = gw(st[0]), wz = gw(st[1]);
    const dx = wx-f.x, dz = wz-f.z, d = Math.hypot(dx,dz);
    if(d < 0.3){ if(f.idx < f.path.length-1) f.idx++; }
    else { const s2 = Math.min(spd*dt, d); f.x += dx/d*s2; f.z += dz/d*s2; }

}
function updateFoes(dt, now, running, moving, inWater){
  let nearest = 999, hunting = false;
  const sight = lampOn ? 32 : 9;
  const noise = (running && moving ? 16 : (moving ? 9 : 5)) + (inWater ? 10 : 0);
  for(const f of foes){
    const fd = Math.hypot(f.x-player.x, f.z-player.z);
    if(!f.active){
      if(now - startedAt > (f.type === "face" ? 5000 : 12000)) f.active = true;
      else { f.sprite.position.set(f.x, -50, f.z); continue; }
    }
    if(f.type === "face"){
      if(fd < sight || fd < noise){ f.mode = "hunt"; f.lastX = player.x; f.lastZ = player.z; }
      else if(f.mode === "hunt" && fd > sight*1.5) f.mode = "search";
      let tx, tz;
      if(f.mode === "hunt"){ tx = player.x; tz = player.z; }
      else if(f.mode === "search"){ tx = f.lastX; tz = f.lastZ;
        if(Math.hypot(f.x-tx, f.z-tz) < 2) f.mode = "wander"; }
      else {
        if(!f.tgt || Math.hypot(f.x-f.tgt[0], f.z-f.tgt[1]) < 2){
          const a = Math.random()*6.28, d = 12+Math.random()*18;
          const c = freeCellNear(player.x+Math.cos(a)*d, player.z+Math.sin(a)*d);
          f.tgt = [gw(c[0]), gw(c[1])];
        }
        tx = f.tgt[0]; tz = f.tgt[1];
      }
      stepFoePath(f, dt, tx, tz, f.mode === "hunt" ? f.speed : f.speed*0.5);
      const open = clamp((16-fd)/14, 0, 1);
      f.sprite.scale.set(2.1*(1+Math.sin(now*0.009)*0.05), 2.4*(1+open*0.35), 1);
      f.y = groundAt(f.x, f.z) + 1.5 + Math.sin(now*0.004)*0.12;
      foeLight.position.set(f.x, f.y+0.2, f.z);
      foeLight.intensity = Math.max(0, 1.0 - fd*0.07);
    }
    else if(f.type === "ojisan"){
      // 跳ねながら来る：短い跳躍と着地の間
      f.hop -= dt;
      let spd = 0, air = 0;
      if(f.hop > 0.34){ spd = f.speed; air = Math.sin((0.62-f.hop)/0.28*Math.PI); }
      else if(f.hop <= 0){ f.hop = 0.62; if(fd < 34) AU.hop(fd); if(Math.random()<0.12 && fd<26) AU.giggle(); }
      stepFoePath(f, dt, player.x, player.z, spd);
      f.y = groundAt(f.x, f.z) + 1.55 + Math.abs(air)*0.55;
      const lean = Math.sin(now*0.006)*0.06;
      f.sprite.scale.set(1.9*(1+lean), 2.85*(1-lean*0.5), 1);
      f.mode = "hunt";
    }
    else {
      // 黒い女：見ていない間に近づき、周期的にワープする
      const dirx = f.x-player.x, dirz = f.z-player.z;
      const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
      const dot = (dirx*fx + dirz*fz)/(Math.hypot(dirx,dirz)||1);
      const seen = dot > 0.72 && (fd < 14 || (lampOn && fd < 30));
      f.frozen = seen;
      f.tp -= dt;
      if(f.tp <= 0){
        const a = player.yaw + Math.PI + (Math.random()-0.5)*2.2;
        const d = 11 + Math.random()*9;
        const c = freeCellNear(player.x+Math.sin(a)*d, player.z+Math.cos(a)*d);
        f.x = gw(c[0]); f.z = gw(c[1]);
        f.tp = 11 + Math.random()*8; f.path = null;
        AU.sting(); AU.whisper();
      }
      if(!seen) stepFoePath(f, dt, player.x, player.z, f.speed);
      f.y = groundAt(f.x, f.z) + 1.55;
      const sw = 1 + Math.sin(now*0.0016)*0.02;
      f.sprite.scale.set(1.5*sw, 3.0, 1);
      f.sprite.material.opacity = seen ? 1 : 0.92;
    }
    f.sprite.position.set(f.x, f.y, f.z);
    if(fd < nearest) nearest = fd;
    if(f.mode === "hunt" && f.type !== "woman") hunting = true;
    if(f.type === "woman" && fd < 16) hunting = true;
    if(fd < 1.05){ caughtBy = f.type; finish("caught"); return { d:nearest, hunting:hunting }; }
  }
  return { d:nearest, hunting:hunting };
}

    }

    x.globalCompositeOperation = "source-over";
    x.fillStyle = "rgba(232,228,222,.85)";

function loadFaceFile(file, done){

      const S = 256, c = document.createElement("canvas"); c.width = c.height = S;

              [()=>this.rustle(),5,15],[()=>this.dog(),40,90],[()=>this.water(),7,17]],
      corridor:[[()=>this.clock(),1.0,1.0],[()=>this.creak(),5,15],[()=>this.chime(),12,32],
                [()=>this.sutra(),38,90],[()=>this.scurry(),16,46]],
      village:[[()=>this.frog(),0.6,2.2],[()=>this.crow(),15,42],[()=>this.dog(),20,52],
               [()=>this.radio(),28,74],[()=>this.siren(),64,120]]
    }[key] || [];
    this.amb = L.map(e => ({ fn:e[0], min:e[1], max:e[2], t:e[1]*Math.random()+1 }));
  },
  quiet(){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    this.chaseGain.gain.setTargetAtTime(0,t,0.25);
    this.scrapeGain.gain.setTargetAtTime(0,t,0.25);
    this.padGain.gain.setTargetAtTime(0,t,0.25);
    this.hbTimer = 0; this.amb = [];
  },
  update(dt, fd, hunting, moving, running, kind, inWater){
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    for(const a of this.amb){ a.t -= dt; if(a.t <= 0){ a.fn(); a.t = a.min+Math.random()*(a.max-a.min); } }
    if(fd < 20){
      const k = clamp((20-fd)/18, 0, 1);
      this.hbTimer -= dt;
      if(this.hbTimer <= 0){ this.heartbeat(); this.hbTimer = 1.2-k*0.78; }
      this.knockT -= dt;
      if(this.knockT <= 0){ this.knock(); this.knockT = 1.4+Math.random()*3.2; }
    } else this.hbTimer = 0;
    const near = clamp((26-fd)/24, 0, 1);
    this.padGain.gain.setTargetAtTime(near*0.075, t, 0.5);
    for(let i=0;i<this.padOsc.length;i++)
      this.padOsc[i].frequency.setTargetAtTime([116,117.7,174,233.6][i]*(1+near*0.06), t, 0.9);
    const chase = hunting ? clamp((30-fd)/26, 0, 1) : 0;
    this.chaseGain.gain.setTargetAtTime(chase*0.075, t, 0.4);
    for(let i=0;i<this.chaseOsc.length;i++)
      this.chaseOsc[i].frequency.setTargetAtTime([622,659,1245][i]*(1+chase*0.16), t, 0.5);
    this.scrapeGain.gain.setTargetAtTime(fd < 11 ? (11-fd)/11*0.055 : 0, t, 0.3);
    if(moving){
      this.stepPhase += dt*(running ? 3.4 : 2.2);
      if(this.stepPhase >= 1){ this.stepPhase = 0; this.step(kind, inWater); }
    } else this.stepPhase = 0.75;
  }
};

      const d = Math.min(Math.hypot(dx,dy),46)/46, a = Math.atan2(dy,dx);

function drawMap(){
  const W = 236, cells = 25, S = W/cells, half = (cells-1)/2;
  map.clearRect(0,0,W,W);
  const gi = Math.floor(player.x/G), gj = Math.floor(player.z/G);
  for(let i=-half;i<=half;i++) for(let j=-half;j<=half;j++){
    if(isBlocked(gi+i,gj+j)){
      map.fillStyle = "rgba(205,192,168,.36)";
      map.fillRect((i+half)*S,(j+half)*S,S,S);
    }
  }
  for(const it of worldItems){
    if(it.got) continue;
    const i = Math.floor(it.x/G)-gi, j = Math.floor(it.z/G)-gj;
    if(Math.abs(i)>half || Math.abs(j)>half) continue;
    map.fillStyle = "#ffe0a0"; map.beginPath(); map.arc((i+half+0.5)*S,(j+half+0.5)*S,3.2,0,7); map.fill();
  }
  for(const f of foes){
    if(!f.active) continue;
    const i = Math.floor(f.x/G)-gi, j = Math.floor(f.z/G)-gj;
    if(Math.abs(i)>half || Math.abs(j)>half) continue;
    map.fillStyle = f.type === "face" ? "#e0402c" : (f.type === "ojisan" ? "#e0a02c" : "#c46ce0");
    map.beginPath(); map.arc((i+half+0.5)*S,(j+half+0.5)*S,4,0,7); map.fill();
  }
  const ei = Math.floor(exitPos.x/G)-gi, ej = Math.floor(exitPos.y/G)-gj;
  if(Math.abs(ei)<=half && Math.abs(ej)<=half){
    map.strokeStyle = itemsLeft() ? "#7a6a52" : "#e8a94b"; map.lineWidth = 2.5;
    map.strokeRect((ei+half)*S,(ej+half)*S,S,S);
  }
  map.save();
  map.translate((player.x/G-gi+half+0.5)*S,(player.z/G-gj+half+0.5)*S);
  map.rotate(-player.yaw);
  map.fillStyle = "#e8a94b";
  map.beginPath(); map.moveTo(0,-7); map.lineTo(5,6); map.lineTo(-5,6); map.closePath(); map.fill();
  map.restore();
}

function updateFusuma(dt){
  const cx = fdiv(player.x,CH), cz = fdiv(player.z,CH);
  for(let a=-1;a<=1;a++) for(let b=-1;b<=1;b++){
    const c = chunks.get((cx+a)+","+(cz+b));
    if(!c) continue;
    for(const f of c.fusuma){
      const d = Math.hypot(f.position.x-player.x, f.position.z-player.z);
      if(!f.userData.opened && d < 2.4){ f.userData.opened = true; AU.fusuma(); }
      const goal = f.userData.opened ? 1 : 0;
      if(f.userData.open !== goal){
        f.userData.open += (goal-f.userData.open)*Math.min(dt*3.4,1);
        const off = f.userData.open*f.userData.w*0.92;
        f.children[0].position.x = off; f.children[1].position.x = off;
      }
    }
  }
}

/* ============ ループ ============ */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  if(state !== "play"){ renderer.render(scene, camera); return; }

  let fwd = 0, side = 0;
  if(keys.KeyW || keys.ArrowUp) fwd += 1;
  if(keys.KeyS || keys.ArrowDown) fwd -= 1;
  if(keys.KeyA || keys.ArrowLeft) side -= 1;
  if(keys.KeyD || keys.ArrowRight) side += 1;
  fwd -= moveVec.y; side += moveVec.x;
  const len = Math.hypot(fwd, side);
  if(len > 1){ fwd /= len; side /= len; }
  if(keys.KeyQ) player.yaw += 2.0*dt*sens;
  if(keys.KeyE) player.yaw -= 2.0*dt*sens;

  const curG = groundAt(player.x, player.z);
  const onBridge = BRIDGES.some(b => Math.abs(player.x-b.x) < b.hx && Math.abs(player.z-b.z) < b.hz);
  const inWater = stage.water && !onBridge && curG < WATER + 0.35;
  const running = !!(keys.ShiftLeft || keys.ShiftRight) || len > 0.85;
  const speed = (running ? 8.6 : 5.4) * (inWater ? 0.45 : 1);
  const sin = Math.sin(player.yaw), cos = Math.cos(player.yaw);
  const tx = (-sin*fwd + cos*side)*speed, tz = (-cos*fwd - sin*side)*speed;
  player.vx += (tx-player.vx)*Math.min(dt*18,1);
  player.vz += (tz-player.vz)*Math.min(dt*18,1);

  let nx = player.x + player.vx*dt, nz = player.z;
  let pr = pushOut(nx, nz, RAD);
  if(groundAt(pr[0], pr[1]) - curG < CLIMB && Math.hypot(pr[0],pr[1]) < BOUND){ player.x = pr[0]; player.z = pr[1]; }
  else player.vx *= 0.2;
  pr = pushOut(player.x, player.z + player.vz*dt, RAD);
  if(groundAt(pr[0], pr[1]) - curG < CLIMB && Math.hypot(pr[0],pr[1]) < BOUND){ player.x = pr[0]; player.z = pr[1]; }
  else player.vz *= 0.2;

  const gY = groundAt(player.x, player.z);
  player.y += (gY - player.y)*Math.min(dt*11, 1);
  const moving = Math.hypot(player.vx, player.vz) > 1.2;
  player.bob += Math.hypot(player.vx, player.vz)*dt*2.2;
  camera.position.set(player.x, player.y + EYE + Math.sin(player.bob)*0.05, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0, "YXZ");
  syncChunks(player.x, player.z);
  updateFusuma(dt);

  // 境界の警告
  const dc = Math.hypot(player.x, player.z);
  if(dc > BOUND-30){ elWarn.textContent = "これ以上は登れない"; elWarn.style.opacity = clamp((dc-(BOUND-30))/16, 0, 1); }
  else elWarn.style.opacity = 0;

  for(const it of worldItems){
    if(it.got) continue;
    it.shape.rotation.y += dt*1.3;
    it.shape.position.y = 1.0 + Math.sin(now*0.003+it.x)*0.09;
    if(Math.hypot(it.x-player.x, it.z-player.z) < 1.6 && Math.abs(groundAt(it.x,it.z)-player.y) < 3){
      it.got = true; scene.remove(it.mesh); refreshItems();
      const left = itemsLeft();
      if(left === 0){
        AU.unlock(); elFlash.textContent = "道具が揃った";
        if(exitObj && exitObj.userData.lampMesh){
          const m = exitObj.userData.lampMesh.material;
          m.color.setHex(0xffd9a0); m.emissive.setHex(0xffc46a); m.emissiveIntensity = 1.4;
        }
        if(exitLight){ exitLight.color.setHex(0xffc46a); exitLight.intensity = 2.2; }
      } else { AU.pick(); elFlash.textContent = it.def.name+"を拾った（残り "+left+"）"; }
      elFlash.style.opacity = 1; flashUntil = now+1300;
    }
  }
  if(flashUntil && now > flashUntil){ elFlash.style.opacity = 0; flashUntil = 0; }

  let target = null, label = "";
  for(const it of worldItems) if(!it.got){
    if(!target || Math.hypot(it.x-player.x, it.z-player.z) < Math.hypot(target[0]-player.x, target[1]-player.z)){
      target = [it.x, it.z]; label = it.def.name;
    }
  }
  if(!target){ target = [exitPos.x, exitPos.y]; label = stage.exit.name; }
  elCTarget.textContent = label;
  elGateDist.textContent = stage.exit.name+"まで "+Math.round(Math.hypot(exitPos.x-player.x, exitPos.y-player.z))+" m"
    + (itemsLeft() ? "（"+stage.exit.locked+"）" : "");
  const ga = Math.atan2(target[0]-player.x, -(target[1]-player.z)) - player.yaw;
  elNeedle.setAttribute("transform", "rotate("+(ga*180/Math.PI).toFixed(1)+" 15 15)");
  if(exitObj){
    if(itemsLeft() === 0 && exitObj.userData.door)
      exitObj.userData.door.position.x = Math.min(4.6, exitObj.userData.door.position.x + dt*1.6);
    if(Math.hypot(exitPos.x-player.x, exitPos.y-player.z) < 3.6 && itemsLeft() === 0){ finish("escaped"); return; }
  }

  const st = updateFoes(dt, now, running, moving, inWater);
  if(state !== "play") return;
  const fd = st.d;
  const dread = clamp((14-fd)/11, 0, 1);
  elDread.style.opacity = dread*(0.55 + 0.45*Math.abs(Math.sin(now*0.005)));
  if(fd < 7){
    const k = (7-fd)*0.006;
    camera.position.x += (Math.random()-0.5)*k;
    camera.position.y += (Math.random()-0.5)*k;
  }
  AU.update(dt, fd, st.hunting, moving, running, stage.step, inWater);
  drawMap();
  renderer.render(scene, camera);
}
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
initTextures();
applyStage("forest");
buildBridges();
syncChunks(0,0);
titleScreen();
renderer.render(scene, camera);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
